server:
  host: 0.0.0.0
  port: 8001

storage:
  type: local
  local_path: ./data/storage
  base_path: /memory

llm:
  api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini

vector_store:
  type: faiss
  dimension: 1536
  index_path: ./data/vector_store

log:
  level: DEBUG
  rotation: 10MB
  retention: 7 days